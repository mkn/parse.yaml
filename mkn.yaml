#! clean build -p test -dtOa -fPIC

name: parse.yaml

parent: lib

profile:
  - name: headers
    inc: p/include
    sub: yaml_cpp#master&p(https://github.com/jbeder/yaml-cpp)
    if_arg:
        static: -DYAML_CPP_STATIC_DEFINE

  - name: lib
    parent: headers
    src: p/src
    if_arg:
        win_shared: -Dyaml_cpp_EXPORTS

  - name: shared
    parent: lib
    mode: shared

  - name: test
    parent: headers
    inc: p/test p/src
    src: |
        p/test, 0
        p/test/integration
    dep: google.test
    main: p/test/main.cpp
    self: lib
    if_arg:
        win_shared: -DGTEST_LINKED_AS_SHARED_LIBRARY=1
