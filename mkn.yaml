#! clean build -p test -dtOa -fPIC

name: parse.yaml
version: 0.8.0-beta.1  # merged into latest: tagged and published, a pre-release (-beta.1) never marked latest

property:
  yaml_cpp: 0.8.0  # yaml-cpp git ref

parent: lib

profile:
  - name: headers
    inc: p/include
    sub: yaml_cpp#${yaml_cpp}&p(https://github.com/jbeder/yaml-cpp)

  - name: lib
    parent: headers
    src: p/src
    if_arg:
        win_shared: -Dyaml_cpp_EXPORTS
    pub_arg:  # with dependents: a static yaml-cpp's headers must not dllimport on Windows
        static: -DYAML_CPP_STATIC_DEFINE

  - name: static
    parent: lib
    mode: static

  - name: shared
    parent: lib
    mode: shared

  - name: test
    parent: headers
    inc: p/test p/src
    src: |
        p/test, 0
        p/test/integration
    dep: google.test
    main: p/test/main.cpp
    self: lib
    if_arg:
        win_shared: -DGTEST_LINKED_AS_SHARED_LIBRARY=1
