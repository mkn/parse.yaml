name: release

# Release binaries, see res/ci/manifest.py: every PR into master or latest builds them, a PR merged into
#  latest publishes them as mkn.yaml's version: that tag, a GitHub release marked latest, mkn.manifest.yml

on:
  pull_request:
    branches: [ master, latest ]
    types: [ opened, synchronize, reopened, closed ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'closed' }}
  cancel-in-progress: true

env:
  CURL_GET: curl -fL --retry 3 --retry-delay 2
  PATH_GET: https://github.com/mkn/mkn/releases/download/latest
  ARGS: -std=c++20 -fPIC -O2 -DNDEBUG  # explicit: mkn's -O adds -march=native
  # a merged PR builds its merge commit, an open one GitHub's merge of it
  REF: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || '' }}

jobs:
  linux:
    if: github.event.action != 'closed' || (github.event.pull_request.merged && github.base_ref == 'latest')
    strategy:
      fail-fast: false
      matrix:
        include:
        - { runner: ubuntu-22.04, image: "quay.io/pypa/manylinux_2_28_x86_64", mkn: mkn_manylinux, arch: x86_64 }
        - { runner: ubuntu-26.04-arm, image: "quay.io/pypa/manylinux_2_28_aarch64", mkn: mkn_manylinux_arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ env.REF }}
    - run: |
        $CURL_GET -o mkn ${PATH_GET}/${{ matrix.mkn }} && chmod +x mkn
        ./mkn clean build -dtp static -a "$ARGS" -g 0
        ./mkn clean build -dtp shared -a "$ARGS" -g 0
        PY=$(command -v python3 || ls /opt/python/cp312-cp312/bin/python3)
        $PY res/ci/manifest.py collect dist "os=nix;arch=${{ matrix.arch }};cxxrt=libstdc++;libc=manylinux_2_28" \
          "$(./mkn -v | cut -d' ' -f1)"
    - uses: actions/upload-artifact@v4.4.0
      with:
        name: nix-${{ matrix.arch }}
        path: dist
        retention-days: 3

  macos:
    if: github.event.action != 'closed' || (github.event.pull_request.merged && github.base_ref == 'latest')
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ env.REF }}
    - run: |
        $CURL_GET -o mkn ${PATH_GET}/mkn_arm_osx && chmod +x mkn
        ./mkn clean build -dtp static -a "$ARGS" -g 0
        ./mkn clean build -dtp shared -a "$ARGS" -g 0
        python3 res/ci/manifest.py collect dist "os=bsd;arch=arm64;cxxrt=libc++;macos=13.0" \
          "$(./mkn -v | cut -d' ' -f1)"
    - uses: actions/upload-artifact@v4.4.0
      with:
        name: bsd-arm64
        path: dist
        retention-days: 3

  windows:
    if: github.event.action != 'closed' || (github.event.pull_request.merged && github.base_ref == 'latest')
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ env.REF }}
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: amd64
    - shell: bash
      env:
        MKN_CL_PREFERRED: 1
      run: |
        rm -f /usr/bin/link /bin/link  # Git's link interferes with cl's link.exe
        $CURL_GET -o mkn.exe ${PATH_GET}/mkn.exe
        WARGS="-EHsc -std:c++20 -O2 -DNDEBUG -MD"
        ./mkn clean build -dtp static -a "$WARGS" -g 0
        ./mkn clean build -dtp shared -a "$WARGS" -g 0
        python res/ci/manifest.py collect dist "os=win;arch=x86_64;cxxrt=msvc;crt=md" \
          "$(./mkn -v | cut -d' ' -f1)"
    - uses: actions/upload-artifact@v4.4.0
      with:
        name: win-x86_64
        path: dist
        retention-days: 3

  publish:
    needs: [ linux, macos, windows ]
    if: github.event.action == 'closed' && github.event.pull_request.merged && github.base_ref == 'latest'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ env.REF }}
    - uses: actions/download-artifact@v5
      with:
        path: dist
        merge-multiple: true
    - id: version
      run: |
        version=$(sed -n 's/^version: *\([^ #]*\).*/\1/p' mkn.yaml)
        if [ -z "$version" ] || [ "$version" = master ]; then
          echo "mkn.yaml version must be a release on latest, not '$version'"; exit 1
        fi
        if git ls-remote --exit-code --tags origin "refs/tags/$version" > /dev/null; then
          echo "tag $version exists, bump mkn.yaml version"; exit 1
        fi
        python3 res/ci/manifest.py merge dist/mkn.manifest.yml "$version" "$REF" dist/*.json
        rm dist/*.json
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: ${{ steps.version.outputs.version }}
        target_commitish: ${{ env.REF }}
        make_latest: true
        files: dist/*
